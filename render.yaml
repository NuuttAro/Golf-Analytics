# Render blueprint: New → Blueprint → pick this repo. Fill the secret values in the dashboard.
services:
  - type: web
    name: carry-golf
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_REQUESTS_PER_HOUR
        value: "30"
